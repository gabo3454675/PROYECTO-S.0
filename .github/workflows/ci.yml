name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # .mvn/jvm.config usa el almacén de certificados de Windows (Windows-ROOT),
      # que no existe en Ubuntu y hace que Maven no pueda descargar dependencias.
      - name: Remove Windows-only Maven JVM config
        run: rm -f .mvn/jvm.config
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
